name: Odoo compatibility
on:
  push:
    branches: ['17.0', '18.0', '19.0', '20.0']
    paths: ['payment_onvo/**', 'scripts/**', 'tests/**', 'compose.yaml', '.github/workflows/**']
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        odoo: ${{ fromJSON(github.ref_name == '18.0' && '[18]' || github.ref_name == '19.0' && '[19]' || github.ref_name == '20.0' && '[20]' || '[17,18,19,20]') }}
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: disposable-ci-database-only
      POSTGRES_VERSION: ${{ matrix.odoo == 20 && '16' || '15' }}
      ODOO_VERSION: ${{ matrix.odoo }}.0
      ADDONS_PATH: ./build/payment_onvo
    steps:
      - uses: actions/checkout@v4
      - name: Security validation
        run: python3 -m unittest discover -s tests -v
      - name: Build matching add-on
        run: python3 scripts/build_version.py ${{ matrix.odoo }} --output build
      - name: Fresh Odoo install and integration tests
        run: |
          docker compose up -d db
          docker compose run --rm odoo odoo -d onvo_test -i payment_onvo --without-demo=all --test-enable --test-tags /payment_onvo --stop-after-init
      - name: Stop test containers
        if: always()
        run: docker compose down -v
